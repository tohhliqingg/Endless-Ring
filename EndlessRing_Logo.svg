<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">EndlessRing logo</title>
  <desc id="desc">EndlessRing wordmark with circular ring icon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020814"/>
      <stop offset="100%" stop-color="#06152b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86d2ff"/>
      <stop offset="100%" stop-color="#4f9dff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" rx="36" fill="url(#bg)"/>
  <g transform="translate(120,120)">
    <circle cx="110" cy="200" r="58" fill="none" stroke="url(#ring)" stroke-width="14"/>
    <circle cx="110" cy="200" r="30" fill="#020814"/>
    <text x="220" y="235" fill="#f4f3ee" font-size="118" font-family="Georgia, Times New Roman, serif" font-weight="700">EndlessRing</text>
    <text x="224" y="312" fill="#86d2ff" font-size="28" font-family="Arial, Helvetica, sans-serif" letter-spacing="10">BUMP · TAP · CONNECT</text>
  </g>
</svg>